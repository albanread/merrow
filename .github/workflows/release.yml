name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: "0.15.2"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run tests
        run: zig build test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive: tar.gz

          - name: linux-aarch64
            target: aarch64-linux-gnu
            os: ubuntu-latest
            ext: ""
            archive: tar.gz

          - name: macos-x86_64
            target: x86_64-macos-none
            os: macos-latest
            ext: ""
            archive: tar.gz

          - name: macos-aarch64
            target: aarch64-macos-none
            os: macos-latest
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DIRNAME="merrow-${TAG}-${{ matrix.name }}"
          mkdir -p "${DIRNAME}/fonts"

          cp zig-out/bin/merrow${{ matrix.ext }} "${DIRNAME}/"
          cp fonts/*.ttf "${DIRNAME}/fonts/"
          cp README.md "${DIRNAME}/"

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar czf "${DIRNAME}.tar.gz" "${DIRNAME}"
            echo "ASSET=${DIRNAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Generate checksum
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
          else
            shasum -a 256 "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Combine checksums
        run: |
          cat artifacts/*.sha256 > artifacts/checksums-sha256.txt
          echo "--- SHA-256 Checksums ---"
          cat artifacts/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Merrow ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/checksums-sha256.txt
